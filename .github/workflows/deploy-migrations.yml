name: Database Migrations

on:
  push:
    branches: [main, develop]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-migrations.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"

jobs:
  validate-migrations:
    name: Validate Migration Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate SQL syntax
        run: |
          supabase --version
          # Check for basic SQL syntax issues
          for file in supabase/migrations/*.sql; do
            if [ -f "$file" ]; then
              echo "Validating $file..."
              # Basic validation - check for common issues
              if grep -q "DROP TABLE\|DELETE FROM\|TRUNCATE" "$file"; then
                echo "⚠️  Warning: Destructive operation detected in $file"
              fi
            fi
          done

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: validate-migrations
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run migrations on staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          echo "🚀 Running migrations on staging..."
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push

      - name: Verify migration success
        run: |
          echo "✅ Staging migration completed successfully!"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate-migrations
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create backup before migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
        run: |
          echo "📦 Creating backup before migration..."
          mkdir -p backups
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backups/schema-backup.sql || echo "Backup skipped - new project"

      - name: Run migrations on production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          echo "🚀 Running migrations on production..."
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push

      - name: Verify migration success
        run: |
          echo "✅ Production migration completed successfully!"

      - name: Notify team
        if: success()
        run: |
          echo "✅ Production migration completed successfully!"
          # Add Slack/Discord notification here if needed
